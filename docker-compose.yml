services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: careermind_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
      POSTGRES_DB: careermind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careermind_user -d careermind_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://careermind_user:${POSTGRES_PASSWORD:?Set a private database password}@postgres:5432/careermind_db
      SECRET_KEY: ${SECRET_KEY:?Set a private signing key of at least 32 characters}
      DEFAULT_AI_PROVIDER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - resume_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
  resume_data:
