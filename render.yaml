services:
  - type: web
    name: careermind-ai
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEFAULT_AI_PROVIDER
        value: ollama
      - key: AI_FALLBACK_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Ephemeral demo storage; configure persistent storage before retaining user data.
      - key: DATABASE_URL
        value: sqlite:///./careermind.db
