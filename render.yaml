# Render Deployment Configuration for CareerMind AI
#
# Note: Render Free tier does not support persistent disks.
# The primary service 'careermind-ai' below defines the authorized free setup.
# Database and uploaded files reside on the ephemeral container filesystem (/app/data)
# and do not persist across instance replacement or redeployment.

services:
  - type: web
    name: careermind-ai
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: DEFAULT_AI_PROVIDER
        value: ollama
      - key: AI_FALLBACK_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /app/data/uploads/resumes
      - key: DATABASE_URL
        value: sqlite:////app/data/careermind.db

# ----------------------------------------------------------------------------
# OPTIONAL PAID PRODUCTION CONFIGURATION (Approval & paid resources required)
# ----------------------------------------------------------------------------
# To provision durable storage on Render, upgrade to the Starter plan ($7/mo)
# and attach a persistent disk ($0.25/mo per GB), or migrate to managed PostgreSQL
# plus S3/Cloudflare R2 object storage.
