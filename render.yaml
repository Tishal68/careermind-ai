services:
  - type: web
    name: careermind-ai
    runtime: docker
    region: oregon
    plan: starter
    disk:
      name: careermind-data
      mountPath: /app/data
      sizeGB: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEFAULT_AI_PROVIDER
        value: ollama
      - key: AI_FALLBACK_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /app/data/uploads/resumes
      # One-instance deployment: SQLite and uploads share a persistent disk.
      - key: DATABASE_URL
        value: sqlite:////app/data/careermind.db
