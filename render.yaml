# Free Render web service with externally managed Supabase PostgreSQL.
# Set DATABASE_URL privately to the Supabase session pooler URI (port 5432).
# Resume originals are stored in PostgreSQL; local uploads are temporary.

services:
  - type: web
    name: careermind-ai
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: DEFAULT_AI_PROVIDER
        value: ollama
      - key: AI_FALLBACK_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /app/data/uploads/resumes
      - key: DATABASE_URL
        sync: false
